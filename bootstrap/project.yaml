apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: fieldsignal
  namespace: argocd
spec:
  description: One complete FieldSignal application per environment
  sourceRepos:
    - oci://ghcr.io/rpjweez/fieldsignal-releases/fieldsignal
    - https://github.com/RPJWeez/fieldsignal-deploy.git
  destinations:
    - {
        server: https://kubernetes.default.svc,
        namespace: fieldsignal-qualification,
      }
    - { server: https://kubernetes.default.svc, namespace: fieldsignal-staging }
    - {
        server: https://kubernetes.default.svc,
        namespace: fieldsignal-production,
      }
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
    - { group: apps, kind: Deployment }
    - { group: "", kind: Service }
