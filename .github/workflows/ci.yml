name: Deployment configuration CI
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read, packages: read }
concurrency:
  group: configuration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "22.22.0", cache: npm }
      - run: npm ci
      - run: npm test
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4
        with: { version: v3.18.4 }
      - uses: oras-project/setup-oras@22ce207df3b08e061f537244349aac6ae1d214f6
        with: { version: 1.3.0 }
      - uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
        with: { cosign-release: v3.1.4 }
      - name: Verify promoted candidates and render prospective environments
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          for application in environments/*/application.yaml; do
            [[ -f "$application" ]] || continue
            environment=$(basename "$(dirname "$application")")
            reference=$(node --input-type=module - "$application" <<'JS'
          import fs from 'node:fs'; import {parse} from 'yaml';
          const s=parse(fs.readFileSync(process.argv[2], 'utf8')).spec.sources[0];
          console.log(s.repoURL.replace('oci://','')+'@'+s.targetRevision);
          JS
            )
            cosign verify "$reference" --certificate-identity=https://github.com/RPJWeez/fieldsignal-deploy/.github/workflows/candidate.yml@refs/heads/main --certificate-oidc-issuer=https://token.actions.githubusercontent.com
            gh attestation verify "oci://$reference" --repo RPJWeez/fieldsignal-deploy --signer-workflow RPJWeez/fieldsignal-deploy/.github/workflows/candidate.yml --source-ref refs/heads/main --predicate-type https://github.com/RPJWeez/delivery-reference-platform/qualification/v1 --format json > /tmp/qualification.json
            jq -e --arg ref "$reference" 'any(.[]; .verificationResult.statement.predicate.result == "passed" and .verificationResult.statement.predicate.candidate == $ref)' /tmp/qualification.json
            mkdir -p ".work/$environment"
            oras pull "$reference" --output ".work/$environment"
            archive=$(find ".work/$environment" -name '*.tgz' -print -quit)
            [[ -n "$archive" ]]
            gh attestation verify "$archive" --repo RPJWeez/fieldsignal-deploy --signer-workflow RPJWeez/fieldsignal-deploy/.github/workflows/candidate.yml --source-ref refs/heads/main
            gh attestation verify "$archive" --repo RPJWeez/fieldsignal-deploy --source-ref refs/heads/main --predicate-type https://spdx.dev/Document
            helm template fieldsignal "$archive" -f "environments/$environment/values.yaml" --namespace "fieldsignal-$environment" > ".work/$environment/rendered.yaml"
